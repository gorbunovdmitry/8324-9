    font-family:var(--font);

  }
  .app{
    position:relative;
    display:flex;
    flex-direction:column;
    width:100%;
    max-width:480px;
    margin:0 auto;
    height:100dvh;
    background:var(--bg);
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  .header{
    position:relative;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-top:calc(env(safe-area-inset-top) + 6px);
    padding-bottom:10px;
    background:var(--bg);
  }
  .header .back{
    position:absolute;
    left:8px;
    bottom:6px;
    width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    border:0;background:transparent;cursor:pointer;
    color:var(--text);
  }
  .header .center{ text-align:center; line-height:1.15; }
  .header .title{ font-size:17px; font-weight:600; letter-spacing:-0.1px; }
  .header .subtitle{
    display:flex; align-items:center; justify-content:center; gap:3px;
    margin-top:2px; font-size:13px; color:var(--muted);
  }
  .header .subtitle svg{ display:block; }

  /* ---------- Messages ---------- */
  .messages{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:8px 0 12px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    min-height:0;
  }
  .messages-inner{ display:flex; flex-direction:column; gap:6px; }

  .day{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin:6px 0 10px;
  }

  .row{
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:0 12px;
  }
  .row.assistant{ justify-content:flex-start; }
  .row.user{ justify-content:flex-end; }

  .avatar-col{ flex:0 0 44px; width:44px; }
  .avatar{
    width:44px;height:44px;border-radius:50%;
    background:#fbe8e7;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .avatar.hidden{ visibility:hidden; }

  .col{ display:flex; flex-direction:column; gap:8px; max-width:78%; min-width:0; }
  .sender{ color:var(--muted); font-size:15px; margin:2px 0 2px 4px; }

  .bubble{
    background:var(--bg);
    border:1px solid var(--bubble-border);
    border-radius:18px;
    padding:13px 16px;
    font-size:16px;
    line-height:1.4;
    color:var(--text);
    white-space:pre-wrap;
    word-wrap:break-word;
    max-width:100%;
    animation:pop .18s ease-out;
  }
  .row.user .bubble{
    background:var(--user-bubble);
    border-color:var(--user-bubble);
  }
  @keyframes pop{ from{opacity:0; transform:translateY(6px) scale(.98);} to{opacity:1; transform:none;} }

  /* typing indicator */
  .typing{ display:flex; align-items:center; gap:5px; padding:16px; }
  .typing span{
    width:8px;height:8px;border-radius:50%;
    background:#c3c4c9;
    animation:blink 1.3s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:.18s; }
  .typing span:nth-child(3){ animation-delay:.36s; }
  @keyframes blink{ 0%,80%,100%{opacity:.35; transform:translateY(0);} 40%{opacity:1; transform:translateY(-3px);} }
  /* подсказка «собираю ответ…» рядом с точками: не сжимается и не переносится */
  .typing .hint{
    /* сбрасываем стили точки (.typing span задаёт 8x8, фон и анимацию) */
    width:auto; height:auto; border-radius:0; background:none; animation:none;
    margin-left:8px; font-size:14px; color:var(--muted);
    white-space:nowrap; flex:0 0 auto; align-self:center;
    opacity:1; transition:opacity .18s ease;   /* мягкая смена подписи каждые 4 с */

  .chips{ display:flex; flex-wrap:wrap; gap:8px; animation:pop .18s ease-out; }
  .chip{
    border:1px solid #dcdee1;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    font-size:15px;
    line-height:1.2;
    padding:11px 16px;
    border-radius:20px;
    cursor:pointer;
    text-align:left;
  }
  .chip:active{ background:var(--user-bubble); }

  /* ---------- Input bar ---------- */
  .inputbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);
    background:var(--bg);
    border-top:1px solid var(--bar-border);
  }
  .field{
    flex:1 1 auto;
    display:flex;align-items:center;
    background:var(--bg);
    border:1px solid var(--field-border);
    border-radius:22px;
    padding:0 16px;
    min-height:44px;
  }
  .field input{
    width:100%;
    border:0;outline:0;background:transparent;
    font-family:var(--font);
    font-size:16px;
    color:var(--text);
    padding:11px 0;
  }
  .field input::placeholder{ color:var(--muted); opacity:1; }
  .send{
    flex:0 0 auto;
    width:44px;height:44px;border-radius:50%;
    border:0; cursor:pointer;
    background:var(--red);
    display:flex;align-items:center;justify-content:center;
    transform:scale(0);
    transition:transform .14s ease-out;
  }
  .send.visible{ transform:scale(1); }
  .send:active{ filter:brightness(.92); }

  /* экран-заглушка: ответа нет, вопрос сохранён */
  .stub{
    position:absolute; inset:0; background:var(--bg); display:none; flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 8px) 24px calc(env(safe-area-inset-bottom) + 20px);
  }
  body.show-stub .app > .header,
  body.show-stub .app > .messages,
  body.show-stub .app > .inputbar{ display:none; }
  body.show-stub .stub{ display:flex; }
  .stub .stub-head{ flex:0 0 auto; height:44px; }
  .stub .stub-body{
    flex:1 1 auto; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:14px; padding-bottom:40px;
  }
  .stub .icon{ margin-bottom:6px; }
  .stub h1{ font-size:22px; font-weight:600; margin:0; letter-spacing:-0.2px; }
  .stub p{ font-size:16px; line-height:1.4; color:var(--muted); margin:0; max-width:300px; }
</style>

<script>
(function(){
  "use strict";

  // ====== КОНФИГ ЭКСПЕРИМЕНТА ======
  // Строки ниже заменяет build.py — не убирайте маркеры BUILD:.
  var CONFIG = {"exp": 8324, "num": 9, "greeting": "Привет! Это ИИ-ассистент Альфа-Банка. Помогу разобраться с личными финансами. С чего начнём?", "chips": ["Совет по моим финансам", "С чего начать?", "Что умеет ИИ-ассистент?"]}; // BUILD:CONFIG
  var WEBHOOK_URL = "PASTE_APPS_SCRIPT_8324_URL"; // BUILD:WEBHOOK


  var VAR = CONFIG.num;
  var EXP = CONFIG.exp;

  // Стартовые чипсы — универсальные, одинаковые во всех вариантах
  var STARTER_CHIPS = CONFIG.chips;
  // ── Финальный экран ──────────────────────────────────────────────────────
  // Назад уйти нельзя: иначе человек вернётся в чат и задаст вопрос снова,
  // а одно намерение засчитается дважды.
  function trapBack(){
    try{
      history.pushState(null, '', location.href);
      window.addEventListener('popstate', function(){ history.pushState(null, '', location.href); });
    }catch(e){}
  }

  // Анти-повтор. Внимание: на GitHub Pages origin ОБЩИЙ для всех репозиториев
  // (gorbunovdmitry.github.io), так что хранилище делится между экспериментами.
  // Разводит их номер эксперимента в ключе плюс номер варианта.
  // ?test=1 снимает блокировку для проверок.
  var LOCK_KEY = 'alfa' + EXP + '_done_var' + VAR;
  var TEST_MODE = /[?&]test=1(&|$)/.test(location.search);
  function isLocked(){
    if(TEST_MODE) return false;
    try{ return localStorage.getItem(LOCK_KEY) === '1'; }catch(e){ return false; }
  }
  function setLock(){
    if(TEST_MODE) return;
    try{ localStorage.setItem(LOCK_KEY, '1'); }catch(e){}
  }
  function showStubScreen(){
    document.body.classList.add('show-stub');
    document.getElementById('stub').setAttribute('aria-hidden','false');
    trapBack();
    window.scrollTo(0,0);
  }
  var stubShown = false;
  function goToStub(){
    if(!stubShown){ stubShown = true; setLock(); once(ev('end_page_view')); }
    showStubScreen();
  }

  var GREETING = CONFIG.greeting;

  // ====== аналитика: GA4 + Яндекс.Метрика (префикс <номер эксперимента>_) ======
  var YM_ID = 96171108;
  // GA4 — корпоративный и общий: кастомные параметры и user_properties там не
  // зарегистрировать, поэтому шлём ТОЛЬКО чистые события без своих полей (вариант уже
  // зашит в имя события, а «один пользователь / одна сессия» GA4 считает сам).
  // Связка cid/sid живёт в Яндекс.Метрике (params не требуют регистрации) и в
  // Google-таблице, куда cid и sid пишутся с каждым сообщением.
  function track(name, extra){
    try{ if(typeof window.gtag === 'function') window.gtag('event', name); }catch(e){}
    var p = { cid: CID, sid: SID, variant: VAR };
    if(extra) for(var k in extra) p[k] = extra[k];
    try{ if(typeof window.ym === 'function') window.ym(YM_ID, 'reachGoal', name, p); }catch(e){}
  }
  function initAnalyticsIdentity(){
    try{ if(typeof window.ym === 'function'){
      window.ym(YM_ID, 'userParams', { alfa_cid: CID });
      window.ym(YM_ID, 'params', { alfa_sid: SID, alfa_variant: VAR });
    } }catch(e){}
  }
  // Каждое событие уходит один раз НА ЧЕЛОВЕКА, а не на загрузку: отметка живёт
  // в localStorage и переживает перезагрузку. Иначе воронка считалась бы в кликах,
  // и один нетерпеливый с тремя нажатиями выглядел бы как три человека.
  var FIRED_KEY = 'alfa' + EXP + '_fired_var' + VAR;
  var fired = (function(){
    if(TEST_MODE) return {};
    try{ return JSON.parse(localStorage.getItem(FIRED_KEY) || '{}'); }catch(e){ return {}; }
  })();
  function once(name){
    if(fired[name]) return;
    fired[name] = 1;
    if(!TEST_MODE){ try{ localStorage.setItem(FIRED_KEY, JSON.stringify(fired)); }catch(e){} }
    track(name);
  }
  function ev(base){ return EXP + '_' + VAR + '_' + base; }

  // ====== helpers ======
  var thread   = document.getElementById('thread');
  var messages = document.getElementById('messages');
  var input    = document.getElementById('input');
  var sendBtn  = document.getElementById('send');
  var form     = document.getElementById('form');

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function scrollDown(){ messages.scrollTop = messages.scrollHeight; }
  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html != null) e.innerHTML = html;
    return e;
  }

  var CID = (function(){
    try{
      var k = 'alfa' + EXP + '_cid', v = localStorage.getItem(k);
      if(!v){ v = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem(k, v); }
      return v;
    }catch(e){ return 'anon'; }
  })();

  // ====== сессия: диалог хранится 7 дней, пользователь видит свои сообщения ======
  var SESSION_TTL = 7 * 24 * 60 * 60 * 1000;      // неделя
  var SKEY = 'alfa' + EXP + '_session_var' + VAR;         // своя сессия на каждый вариант
  function loadSession(){
    try{
      var s = JSON.parse(localStorage.getItem(SKEY) || 'null');
      if(!s || !s.sid || !s.ts) return null;
      if(Date.now() - s.ts > SESSION_TTL){ localStorage.removeItem(SKEY); return null; }
      return s;
    }catch(e){ return null; }
  }
  function saveSession(){
    try{
      localStorage.setItem(SKEY, JSON.stringify({
        sid: SID, ts: Date.now(),          // ts обновляется — неделя от последней активности
        msgs: msgs, hist: history, chips: lastChips, turns: userTurns
      }));
    }catch(e){}
  }
  var RESTORED = loadSession();
  var SID = RESTORED ? RESTORED.sid
          : 's' + Math.random().toString(36).slice(2,8) + Date.now().toString(36);

  // ====== лог диалога в Google-таблицу (строка на каждое сообщение) ======
  function logRow(role, text, how){
    try{
      if(!WEBHOOK_URL || WEBHOOK_URL.indexOf('PASTE_') === 0){
        console.log('[' + EXP + ']', 'var'+VAR, role+':', text.slice(0,80), how ? '(' + how + ')' : '');
        return;
      }
      fetch(WEBHOOK_URL, {
        method:'POST', mode:'no-cors',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ exp: EXP, variant: VAR, role: role, text: text, via: how || '', cid: CID, sid: SID }),
        keepalive: true
      }).catch(function(){});
    }catch(e){}
  }

  // ====== рендер чата (группы ассистента, как в 8093) ======
  var assistantRow = null, assistantCol = null, avatar = null, firstAssistantGroup = true;
  function ensureAssistantRow(){
    if(assistantRow) return;
    assistantRow = el('div','row assistant');
    var avCol = el('div','avatar-col');
    avatar = el('div','avatar hidden',
      '<svg width="26" height="26" viewBox="0 0 24 24">' +
      '<defs><linearGradient id="spk'+Math.random().toString(36).slice(2,6)+'" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#fb554b"/><stop offset="1" stop-color="#de180b"/>' +
      '</linearGradient></defs>' +
      '<path d="M12 2 C12 7 17 12 22 12 C17 12 12 17 12 22 C12 17 7 12 2 12 C7 12 12 7 12 2 Z" fill="#ef3124"/>' +
      '</svg>');
    avCol.appendChild(avatar);
    assistantCol = el('div','col');
    if(firstAssistantGroup){
      assistantCol.appendChild(el('div','sender','ИИ-ассистент'));
      firstAssistantGroup = false;
    }
    assistantRow.appendChild(avCol);
    assistantRow.appendChild(assistantCol);
    thread.appendChild(assistantRow);
  }
  function closeAssistantGroup(){ assistantRow = null; assistantCol = null; avatar = null; }

  var typingNode = null;
  var slowTimer = null;
  var hintTimer = null;
  // Подписи при долгом ответе: сменяются каждые 4 с, на последней останавливаются.
  // Порядок только вперёд — возврат к «собираю ответ» после «почти готово» читался бы
  // как откат назад.
  var HINTS = ['отправляю…'];
  function showTyping(){
    ensureAssistantRow();
    if(typingNode) return;
    typingNode = el('div','bubble typing','<span></span><span></span><span></span>');
    assistantCol.appendChild(typingNode);
    // Если ответ идёт долго — показываем, что процесс жив, а не завис.
    slowTimer = setTimeout(function(){
      if(!typingNode) return;
      typingNode.innerHTML =
        '<span></span><span></span><span></span>' +
        '<span class="hint">' + HINTS[0] + '</span>';
      var hint = typingNode.querySelector('.hint');
      var i = 0;
      hintTimer = setInterval(function(){
        i++;
        if(!typingNode || !hint || i >= HINTS.length){ clearInterval(hintTimer); hintTimer = null; return; }
        hint.style.opacity = '0';
        setTimeout(function(){ if(hint){ hint.textContent = HINTS[i]; hint.style.opacity = '1'; } }, 180);
      }, 4000);
    }, 6000);
    scrollDown();
  }
  function hideTyping(){
    if(slowTimer){ clearTimeout(slowTimer); slowTimer=null; }
    if(hintTimer){ clearInterval(hintTimer); hintTimer=null; }
    if(typingNode){ typingNode.remove(); typingNode = null; }
  }
  function addAssistantBubble(text){
    ensureAssistantRow();
    var b = el('div','bubble');
    b.textContent = text;
    assistantCol.appendChild(b);
    scrollDown();
    return b;
  }
  function revealAvatar(){ if(avatar) avatar.classList.remove('hidden'); }
  function addUserBubble(text){
    var row = el('div','row user');
    var col = el('div','col');
    var b = el('div','bubble');
    b.textContent = text;
    col.appendChild(b);
    row.appendChild(col);
    thread.appendChild(row);
    closeAssistantGroup();
    scrollDown();
  }

  // ====== чипсы ======
  var chipsRow = null;
  function showChips(labels, viaChip){
    removeChips();
    if(!labels || !labels.length) return;
    chipsRow = el('div','chips-row');
    var chips = el('div','chips');
    labels.forEach(function(label){
      if(!label) return;
      var c = el('button','chip');
      c.type = 'button';
      c.textContent = label;
      c.addEventListener('click', function(){ sendMessage(label, viaChip); });
      chips.appendChild(c);
    });
    chipsRow.appendChild(chips);
    thread.appendChild(chipsRow);
    scrollDown();
  }
  function removeChips(){ if(chipsRow){ chipsRow.remove(); chipsRow = null; } }

  // ====== диалог ======
  var history = [];          // [{role, content}] для модели
  var msgs = [];             // [{role, text}] — то, что видит пользователь (для восстановления)
  var lastChips = [];        // активные чипсы на момент сохранения
  var userTurns = 0;         // счётчик ходов пользователя
  var busy = false;

  // Восстановление сохранённого диалога: без анимации, сразу как было.
  function restoreDialog(s){
    history   = s.hist  || [];
    msgs      = s.msgs  || [];
    userTurns = s.turns || 0;
    lastChips = s.chips || [];
    thread.appendChild(el('div','day','Сегодня'));
    msgs.forEach(function(m){
      if(m.role === 'user') addUserBubble(m.text);
      else { addAssistantBubble(m.text); revealAvatar(); }
    });
    if(lastChips.length) showChips(lastChips, 'chip');
    scrollDown();
  }

  async function sendMessage(text, via){   // via: 'starter' | 'chip' | 'typed'
    text = (text || '').trim();
    if(!text || busy) return;
    busy = true;

    userTurns++;
    // Чипс или набранный текст: совпадение набранного с подписью чипса — всё равно ввод.
    var how = (via === 'typed') ? 'typed' : 'chip';
    var chipNo = STARTER_CHIPS.indexOf(text) + 1;
    once(ev('click_continue'));
    once(ev(how === 'typed' ? 'click_send' : (chipNo > 0 ? 'click_chip' + chipNo : 'click_chip')));

    removeChips();
    addUserBubble(text);
    logRow('user', text, how);
    history.push({ role:'user', content:text });
    msgs.push({ role:'user', text:text });
    lastChips = [];
    saveSession();
    input.value = '';
    updateSendVisibility();

    await sleep(400);
    showTyping();

    // Фейк-дор: ассистент НЕ отвечает. Вопрос уже записан выше (logRow), дальше —
    // экран «сервис в работе». Пауза с индикатором набора нужна, чтобы переход
    // не выглядел мгновенным отказом: человек должен успеть увидеть, что вопрос принят.
    await sleep(900);
    hideTyping();
    goToStub();
    busy = false;
    return;
    saveSession();
    busy = false;
  }

  // ====== intro ======
  async function playIntro(){
    thread.appendChild(el('div','day','Сегодня'));
    await sleep(600);
    showTyping();
    await sleep(1400);
    hideTyping();
    addAssistantBubble(GREETING);
    revealAvatar();
    logRow('assistant', GREETING);
    history.push({ role:'assistant', content: JSON.stringify({ answer: GREETING, followup: '', chips: STARTER_CHIPS }) });
    msgs.push({ role:'assistant', text: GREETING });
    await sleep(400);
    showChips(STARTER_CHIPS, 'starter');
    lastChips = STARTER_CHIPS;
    saveSession();
    scrollDown();
  }

  // ====== ввод ======
  function updateSendVisibility(){
    if(input.value.trim().length > 0) sendBtn.classList.add('visible');
    else sendBtn.classList.remove('visible');
  }

  input.addEventListener('input', updateSendVisibility);
  form.addEventListener('submit', function(e){
    e.preventDefault();
    sendMessage(input.value, 'typed');
  });
  document.getElementById('backBtn').addEventListener('click', function(e){ e.preventDefault(); });
  input.addEventListener('focus', function(){ setTimeout(scrollDown, 250); });

  // Прошедший флоу видит только финал: ни аналитики, ни диалога под ним.
  if(isLocked()){ showStubScreen(); return; }

  initAnalyticsIdentity();
  once(ev('page_view'));
  if(RESTORED && RESTORED.msgs && RESTORED.msgs.length){
    restoreDialog(RESTORED);                 // возврат в течение недели — показываем прежний диалог
  } else {
    playIntro();                             // новая сессия
  }
})();
</script>
</body>
</html>
